<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250">
  <!-- Thunderbird circular badge: bird + lightning bolt + banner -->
  <defs>
    <clipPath id="badge-clip"><circle cx="120" cy="112" r="104"/></clipPath>
    <clipPath id="badge-bird-clip"><ellipse cx="132" cy="108" rx="63" ry="61"/></clipPath>
  </defs>
  <!-- badge disc -->
  <circle cx="120" cy="112" r="108" fill="#9bc716"/>
  <circle cx="120" cy="112" r="100" fill="#151d10"/>
  <!-- subtle rays -->
  <g clip-path="url(#badge-clip)" fill="#1e2a15">
    <path d="M120 112 L60 -20 L100 -20 Z"/>
    <path d="M120 112 L160 -20 L200 -20 Z"/>
    <path d="M120 112 L-40 60 L-40 100 Z"/>
    <path d="M120 112 L280 60 L280 100 Z"/>
    <path d="M120 112 L-20 220 L20 244 Z"/>
    <path d="M120 112 L220 244 L260 220 Z"/>
  </g>
  <!-- lightning bolt -->
  <path d="M144 18 L178 18 L154 90 L184 90 L118 206 L136 122 L108 122 Z"
