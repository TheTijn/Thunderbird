    </g>
    <ellipse cx="132" cy="108" rx="63" ry="61" fill="#7cc42d" stroke="#223607" stroke-width="3.5"/>
    <g clip-path="url(#badge-bird-clip)">
      <ellipse cx="118" cy="54" rx="44" ry="18" fill="#9fdb4a" opacity=".65"/>
      <g fill="#5ca51f" opacity=".9">
        <ellipse cx="98" cy="66" rx="10" ry="6" transform="rotate(-18 98 66)"/>
        <ellipse cx="128" cy="52" rx="12" ry="7"/>
        <ellipse cx="157" cy="60" rx="9" ry="5.5" transform="rotate(14 157 60)"/>
      </g>
      <ellipse cx="152" cy="148" rx="66" ry="52" fill="#f2d93b"/>
      <ellipse cx="152" cy="164" rx="60" ry="34" fill="#e9c52e" opacity=".55"/>
    </g>
    <ellipse cx="132" cy="108" rx="63" ry="61" fill="none" stroke="#223607" stroke-width="3.5"/>
    <path d="M194 103 L 227 91 L 198 114 Z" fill="#53350b"/>
    <path d="M187 82 L 235 77 L 194 104 Z" fill="#f7a821" stroke="#223607" stroke-width="3" stroke-linejoin="round"/>
    <path d="M198 114 L 223 107 L 200 124 Z" fill="#de8a10" stroke="#223607" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="172" cy="82" r="17" fill="#f4f9e4"/>
    <circle cx="173" cy="83" r="13.5" fill="#131a09"/>
    <circle cx="178" cy="77" r="4.8" fill="#ffffff"/>
    <g stroke="#223607" stroke-width="3" stroke-linejoin="round">
      <g transform="translate(106 76) rotate(-92)">
        <ellipse cx="40" cy="0" rx="42" ry="10" fill="#8fd435"/>
        <ellipse cx="66" cy="0" rx="17" ry="8.5" fill="#3f7d15" stroke="none"/>
      </g>
      <g transform="translate(106 76) rotate(-116)">
        <ellipse cx="44" cy="0" rx="46" ry="11" fill="#8fd435"/>
        <ellipse cx="72" cy="0" rx="18" ry="9" fill="#3f7d15" stroke="none"/>
      </g>
      <g transform="translate(106 76) rotate(-140)">
        <ellipse cx="42" cy="0" rx="44" ry="11" fill="#8fd435"/>
        <ellipse cx="69" cy="0" rx="17" ry="9" fill="#3f7d15" stroke="none"/>
      </g>
      <g transform="translate(106 76) rotate(-164)">
        <ellipse cx="36" cy="0" rx="38" ry="10.5" fill="#8fd435"/>
        <ellipse cx="58" cy="0" rx="16" ry="8.5" fill="#3f7d15" stroke="none"/>
      </g>
      <g transform="translate(106 76) rotate(-140)">
