<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
  <!-- line-art bird used as loading / countdown indicator (outline layer).
       Same geometry as bird-flat; feathers sit fully outside the body so the
       drawing stays crisp when the solid fill layer rises inside it. -->
  <g fill="none" stroke="#c6f31d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- wing feathers -->
    <g transform="translate(98 66) rotate(-78)"><ellipse cx="30" cy="0" rx="28" ry="9"/></g>
    <g transform="translate(98 66) rotate(-112)"><ellipse cx="34" cy="0" rx="32" ry="10"/></g>
    <g transform="translate(98 66) rotate(-146)"><ellipse cx="32" cy="0" rx="30" ry="9.5"/></g>
    <!-- tail -->
    <g transform="translate(70 106) rotate(184)"><ellipse cx="26" cy="0" rx="26" ry="8"/></g>
    <!-- body -->
    <ellipse cx="132" cy="108" rx="63" ry="61"/>
    <!-- beak -->
    <path d="M190 84 L 233 79 L 196 103 Z"/>
    <path d="M199 112 L 221 106 L 201 122 Z"/>
    <!-- eye -->
    <circle cx="172" cy="82" r="12"/>
    <!-- feet -->
    <path d="M120 164 C 120 175 128 179 136 176 M146 166 C 147 176 155 180 161 177"/>
  </g>
</svg>
